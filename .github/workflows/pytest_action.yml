name: Testing with Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run tests with coverage and generate XML report
      run: pytest --junitxml=pytest-report-${{ matrix.python-version }}.xml --cov=src --cov-report=term-missing

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: pytest-report-${{ matrix.python-version }}.xml

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Tests failed on Python ${{ matrix.python-version }}"
